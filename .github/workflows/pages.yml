name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push always wins rather than a half-finished deploy sticking.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # dist/ is committed because Pages serves it directly, so it must not be
      # allowed to drift from src/.
      - name: Verify committed dist/ is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Simulation and codec tests
        run: node test/sim.test.mjs

      - name: Single-client browser tests
        run: node test/smoke.test.mjs

      - name: Two-client multiplayer tests
        run: node test/multiplayer.test.mjs

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Publish only what the game needs — not node_modules, src or tests.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css dist _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
